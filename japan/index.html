<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Japan Trip Planner — May 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Tokyo Nights Palette */
            --ink: #0a0a0f;
            --ink-light: #12121a;
            --ink-lighter: #1a1a24;
            --charcoal: #252532;
            --slate: #3d3d52;
            --mist: #6b6b8a;
            --cloud: #9a9ab5;
            --snow: #f0f0f5;

            /* Neon Accents */
            --neon-cyan: #00f5d4;
            --neon-magenta: #ff006e;
            --neon-gold: #ffd60a;
            --neon-vermilion: #e63946;
            --neon-purple: #9b5de5;

            /* City Colors */
            --tokyo: var(--neon-cyan);
            --osaka: var(--neon-magenta);
            --kyoto: var(--neon-vermilion);
            --travel: var(--neon-gold);

            /* Semantic */
            --bg: var(--ink);
            --card: var(--ink-light);
            --card-hover: var(--ink-lighter);
            --text: var(--snow);
            --text-muted: var(--cloud);
            --text-dim: var(--mist);
            --border: var(--charcoal);
            --border-hover: var(--slate);

            /* Typography */
            --font-display: 'Noto Serif JP', Georgia, serif;
            --font-mono: 'Space Mono', monospace;

            /* Spacing */
            --space-xs: 0.25rem;
            --space-sm: 0.5rem;
            --space-md: 1rem;
            --space-lg: 1.5rem;
            --space-xl: 2.5rem;
            --space-2xl: 4rem;

            /* Radii */
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 16px;
            --radius-xl: 24px;
        }

        /* Animated Background */
        body {
            font-family: var(--font-display);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(0, 245, 212, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(255, 0, 110, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse 50% 30% at 50% 100%, rgba(155, 93, 229, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Noise Texture Overlay */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 0;
        }

        /* Header */
        header {
            position: relative;
            z-index: 10;
            padding: var(--space-xl) var(--space-lg);
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, var(--ink) 0%, transparent 100%);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: var(--space-lg);
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }

        .brand-kanji {
            font-size: 0.875rem;
            color: var(--text-dim);
            letter-spacing: 0.5em;
            font-weight: 400;
        }

        h1 {
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--snow) 0%, var(--cloud) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .trip-meta {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: var(--space-sm);
        }

        .header-actions {
            display: flex;
            gap: var(--space-sm);
            align-items: center;
        }

        /* Buttons */
        .btn {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text-muted);
        }

        .btn:hover {
            border-color: var(--border-hover);
            color: var(--text);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--text);
            color: var(--ink);
            border-color: var(--text);
            font-weight: 700;
        }

        .btn-primary:hover {
            background: var(--snow);
            box-shadow: 0 0 20px rgba(240, 240, 245, 0.2);
        }

        .btn-primary.copied {
            background: var(--neon-cyan);
            border-color: var(--neon-cyan);
            color: var(--ink);
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--space-2xl) var(--space-lg);
        }

        /* Legend */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-lg);
            margin-bottom: var(--space-2xl);
            padding-bottom: var(--space-xl);
            border-bottom: 1px solid var(--border);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            font-family: var(--font-mono);
            font-size: 0.6875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        .legend-marker {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            box-shadow: 0 0 8px currentColor;
        }

        .legend-marker.tokyo { background: var(--tokyo); color: var(--tokyo); }
        .legend-marker.osaka { background: var(--osaka); color: var(--osaka); }
        .legend-marker.kyoto { background: var(--kyoto); color: var(--kyoto); }
        .legend-marker.travel { background: var(--travel); color: var(--travel); }

        /* Layout */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: var(--space-2xl);
            align-items: start;
        }

        @media (max-width: 1100px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        /* Section Header */
        .section-header {
            margin-bottom: var(--space-xl);
        }

        .section-label {
            font-family: var(--font-mono);
            font-size: 0.6875rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-dim);
            margin-bottom: var(--space-xs);
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
        }

        /* Calendar */
        .calendar-section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: var(--space-sm);
        }

        .weekday-header {
            font-family: var(--font-mono);
            font-size: 0.625rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-dim);
            text-align: center;
            padding: var(--space-sm) 0;
        }

        .day {
            min-height: 120px;
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
            position: relative;
            padding: var(--space-sm);
            overflow: hidden;
            background: var(--ink-lighter);
        }

        .day::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 0%, rgba(255,255,255,0.03) 100%);
            pointer-events: none;
        }

        .day:hover {
            transform: translateY(-2px) scale(1.02);
            border-color: var(--border-hover);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .day.selected {
            border-color: var(--text);
            box-shadow: 0 0 0 1px var(--text), 0 8px 32px rgba(0,0,0,0.4);
        }

        .day.tokyo {
            background: linear-gradient(135deg, rgba(0, 245, 212, 0.1) 0%, rgba(0, 245, 212, 0.05) 100%);
            border-color: rgba(0, 245, 212, 0.2);
        }
        .day.tokyo:hover { border-color: rgba(0, 245, 212, 0.4); box-shadow: 0 8px 32px rgba(0, 245, 212, 0.15); }

        .day.osaka {
            background: linear-gradient(135deg, rgba(255, 0, 110, 0.1) 0%, rgba(255, 0, 110, 0.05) 100%);
            border-color: rgba(255, 0, 110, 0.2);
        }
        .day.osaka:hover { border-color: rgba(255, 0, 110, 0.4); box-shadow: 0 8px 32px rgba(255, 0, 110, 0.15); }

        .day.kyoto {
            background: linear-gradient(135deg, rgba(230, 57, 70, 0.1) 0%, rgba(230, 57, 70, 0.05) 100%);
            border-color: rgba(230, 57, 70, 0.2);
        }
        .day.kyoto:hover { border-color: rgba(230, 57, 70, 0.4); box-shadow: 0 8px 32px rgba(230, 57, 70, 0.15); }

        .day.travel {
            background: linear-gradient(135deg, rgba(255, 214, 10, 0.08) 0%, rgba(255, 214, 10, 0.03) 100%);
            border-color: rgba(255, 214, 10, 0.15);
        }
        .day.travel:hover { border-color: rgba(255, 214, 10, 0.3); box-shadow: 0 8px 32px rgba(255, 214, 10, 0.1); }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--space-xs);
        }

        .day-number {
            font-family: var(--font-mono);
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--text);
        }

        .day-city {
            font-family: var(--font-mono);
            font-size: 0.5625rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            background: rgba(0,0,0,0.3);
            color: var(--text-muted);
        }

        .day.tokyo .day-city { color: var(--tokyo); }
        .day.osaka .day-city { color: var(--osaka); }
        .day.kyoto .day-city { color: var(--kyoto); }
        .day.travel .day-city { color: var(--travel); }

        .day-items {
            flex: 1;
            overflow: hidden;
            font-size: 0.6875rem;
            line-height: 1.5;
            color: var(--text-dim);
        }

        .day-item {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 1px 0;
        }

        .day-empty {
            font-size: 0.625rem;
            color: var(--text-dim);
            font-style: italic;
            opacity: 0.5;
            margin-top: var(--space-xs);
        }

        /* Detail Panel */
        .detail-panel {
            position: sticky;
            top: var(--space-xl);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
        }

        .detail-header {
            margin-bottom: var(--space-lg);
            padding-bottom: var(--space-lg);
            border-bottom: 1px solid var(--border);
        }

        .detail-date-wrapper {
            display: flex;
            align-items: baseline;
            gap: var(--space-sm);
            margin-bottom: var(--space-xs);
        }

        .detail-date {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1;
        }

        .detail-month {
            font-family: var(--font-mono);
            font-size: 0.875rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .detail-weekday {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .detail-city {
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
            margin-top: var(--space-md);
            padding: var(--space-xs) var(--space-sm);
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 0.625rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
        }

        .detail-city.tokyo {
            background: rgba(0, 245, 212, 0.1);
            color: var(--tokyo);
            border: 1px solid rgba(0, 245, 212, 0.3);
            box-shadow: 0 0 12px rgba(0, 245, 212, 0.2);
        }
        .detail-city.osaka {
            background: rgba(255, 0, 110, 0.1);
            color: var(--osaka);
            border: 1px solid rgba(255, 0, 110, 0.3);
            box-shadow: 0 0 12px rgba(255, 0, 110, 0.2);
        }
        .detail-city.kyoto {
            background: rgba(230, 57, 70, 0.1);
            color: var(--kyoto);
            border: 1px solid rgba(230, 57, 70, 0.3);
            box-shadow: 0 0 12px rgba(230, 57, 70, 0.2);
        }
        .detail-city.travel {
            background: rgba(255, 214, 10, 0.08);
            color: var(--travel);
            border: 1px solid rgba(255, 214, 10, 0.25);
            box-shadow: 0 0 12px rgba(255, 214, 10, 0.15);
        }

        /* Itinerary List */
        .itinerary-list {
            list-style: none;
            margin-bottom: var(--space-lg);
            min-height: 200px;
        }

        .itinerary-item {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-md);
            background: var(--ink-lighter);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-sm);
            animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: grab;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .itinerary-item:hover {
            border-color: var(--border-hover);
            transform: translateX(4px);
        }

        .itinerary-item:active {
            cursor: grabbing;
        }

        .itinerary-item.dragging {
            opacity: 0.5;
            transform: scale(1.02);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .drag-handle {
            cursor: grab;
            color: var(--text-dim);
            padding: var(--space-xs);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .drag-handle:hover {
            color: var(--text);
        }

        .itinerary-item-text {
            flex: 1;
            font-size: 0.9375rem;
            color: var(--text);
            word-break: break-word;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: var(--space-xs);
            border-radius: var(--radius-sm);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-btn:hover {
            color: var(--neon-vermilion);
            background: rgba(230, 57, 70, 0.1);
        }

        /* Add Item Form */
        .add-item-form {
            display: flex;
            gap: var(--space-sm);
        }

        .add-item-input {
            flex: 1;
            font-family: var(--font-display);
            font-size: 0.9375rem;
            padding: var(--space-md);
            background: var(--ink-lighter);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text);
            transition: all 0.3s;
        }

        .add-item-input::placeholder {
            color: var(--text-dim);
        }

        .add-item-input:focus {
            outline: none;
            border-color: var(--text-muted);
            background: var(--charcoal);
        }

        .add-btn {
            font-family: var(--font-mono);
            font-size: 0.6875rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
            background: var(--text);
            color: var(--ink);
            border: none;
            padding: var(--space-md) var(--space-lg);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.3s;
        }

        .add-btn:hover {
            background: var(--snow);
            box-shadow: 0 0 20px rgba(240, 240, 245, 0.2);
            transform: translateY(-1px);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: var(--space-2xl) var(--space-lg);
            color: var(--text-dim);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: var(--space-md);
            opacity: 0.3;
            stroke: var(--text-muted);
        }

        .empty-state p {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: var(--space-xl);
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--card);
            color: var(--text);
            padding: var(--space-md) var(--space-xl);
            border-radius: var(--radius-md);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border: 1px solid var(--border);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Page Load Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-in {
            animation: fadeUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }

        /* Mobile Responsive */
        @media (max-width: 1100px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: var(--space-xl);
            }

            .detail-panel {
                position: static;
                width: 100%;
            }
        }

        @media (max-width: 768px) {
            :root {
                --space-lg: 1.25rem;
                --space-xl: 1.75rem;
                --space-2xl: 2.5rem;
            }

            body {
                font-size: 16px;
            }

            .calendar-grid {
                grid-template-columns: 1fr;
                gap: var(--space-md);
            }

            .weekday-header {
                display: none;
            }

            .day {
                aspect-ratio: auto;
                min-height: auto;
                padding: var(--space-md);
                display: grid;
                grid-template-columns: auto 1fr auto;
                grid-template-rows: auto auto;
                gap: var(--space-xs) var(--space-md);
                align-items: center;
            }

            .day::before {
                display: none;
            }

            .day-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 2px;
                margin-bottom: 0;
                grid-column: 1;
                grid-row: 1 / -1;
            }

            .day-number {
                font-size: 1.5rem;
                line-height: 1;
            }

            .day-city {
                font-size: 0.5rem;
                padding: 1px 4px;
            }

            .day-weekday {
                display: block;
                font-family: var(--font-mono);
                font-size: 0.625rem;
                color: var(--text-dim);
                text-transform: uppercase;
                letter-spacing: 0.1em;
                grid-column: 2;
                grid-row: 1;
                margin-bottom: 0;
            }

            .day-items {
                grid-column: 2 / -1;
                grid-row: 2;
                font-size: 0.875rem;
                display: flex;
                flex-direction: column;
                gap: var(--space-xs);
                overflow: visible;
            }

            .day-item {
                white-space: normal;
                overflow: visible;
                text-overflow: clip;
                background: rgba(0,0,0,0.2);
                padding: 4px 8px;
                border-radius: var(--radius-sm);
                font-size: 0.75rem;
            }

            .day-empty {
                margin-top: 0;
                font-size: 0.75rem;
            }

            .container {
                padding: var(--space-lg) var(--space-md);
            }

            header {
                padding: var(--space-lg) var(--space-md);
            }

            .header-content {
                flex-direction: column;
                align-items: stretch;
                gap: var(--space-md);
            }

            .brand {
                text-align: center;
            }

            h1 {
                font-size: clamp(1.5rem, 6vw, 2rem);
            }

            .header-actions {
                justify-content: center;
            }

            .btn {
                padding: var(--space-sm) var(--space-md);
                font-size: 0.8125rem;
                flex: 1;
                max-width: 140px;
                justify-content: center;
            }

            /* Hide empty placeholder days in mobile view */
            .day[style*="visibility: hidden"] {
                display: none;
            }

            /* Detail panel mobile improvements */
            .detail-panel {
                padding: var(--space-lg);
            }

            .detail-date {
                font-size: 2.5rem;
            }

            .itinerary-item {
                padding: var(--space-md);
                gap: var(--space-md);
            }

            .itinerary-item-text {
                font-size: 1rem;
            }

            .add-item-form {
                flex-direction: column;
            }

            .add-item-input {
                font-size: 16px;
                padding: var(--space-md);
            }

            .add-btn {
                width: 100%;
                padding: var(--space-md);
            }

            /* Drag handle hidden on mobile (touch doesn't need it) */
            .drag-handle {
                display: none;
            }

            /* Legend improvements */
            .legend {
                justify-content: center;
                gap: var(--space-md) var(--space-lg);
                margin-bottom: var(--space-xl);
                padding-bottom: var(--space-lg);
            }

            .legend-item {
                font-size: 0.625rem;
            }

            /* Toast positioning */
            .toast {
                left: var(--space-md);
                right: var(--space-md);
                transform: translateY(100px);
                text-align: center;
            }

            .toast.show {
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .day {
                grid-template-columns: 50px 1fr;
            }

            .day-items {
                grid-column: 2;
            }

            .day-city {
                display: none;
            }

            .legend {
                gap: var(--space-sm);
            }

            .legend-item {
                font-size: 0.5625rem;
            }

            .legend-marker {
                width: 6px;
                height: 6px;
            }
        }

        /* Day weekday hidden by default, shown in mobile */
        .day-weekday {
            display: none;
        }
    </style>
</head>
<body>
    <header class="animate-in">
        <div class="header-content">
            <div class="brand">
                <div class="brand-kanji">旅行計画</div>
                <h1>Japan 2026</h1>
                <div class="trip-meta">May 14 — 24, 2026</div>
            </div>
            <div class="header-actions">
                <button class="btn" onclick="toggleTheme()" aria-label="Toggle theme">
                    <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                </button>
                <button class="btn btn-primary" onclick="copyShareLink()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
                        <polyline points="16 6 12 2 8 6"/>
                        <line x1="12" y1="2" x2="12" y2="15"/>
                    </svg>
                    <span id="shareText">Share</span>
                </button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="legend animate-in delay-1">
            <div class="legend-item">
                <div class="legend-marker tokyo"></div>
                <span>Tokyo</span>
            </div>
            <div class="legend-item">
                <div class="legend-marker osaka"></div>
                <span>Osaka</span>
            </div>
            <div class="legend-item">
                <div class="legend-marker kyoto"></div>
                <span>Kyoto</span>
            </div>
            <div class="legend-item">
                <div class="legend-marker travel"></div>
                <span>Travel Day</span>
            </div>
        </div>

        <div class="main-content">
            <div class="calendar-section animate-in delay-2">
                <div class="section-header">
                    <div class="section-label">Calendar</div>
                    <div class="section-title">May 2026</div>
                </div>
                <div class="calendar-grid" id="calendarGrid">
                    <div class="weekday-header">Mon</div>
                    <div class="weekday-header">Tue</div>
                    <div class="weekday-header">Wed</div>
                    <div class="weekday-header">Thu</div>
                    <div class="weekday-header">Fri</div>
                    <div class="weekday-header">Sat</div>
                    <div class="weekday-header">Sun</div>
                    <!-- Days will be generated by JS -->
                </div>
            </div>

            <div class="detail-panel animate-in delay-3" id="detailPanel">
                <div class="detail-header">
                    <div class="detail-date-wrapper">
                        <div class="detail-date" id="detailDate">—</div>
                        <div class="detail-month" id="detailMonth">Select a day</div>
                    </div>
                    <div class="detail-weekday" id="detailWeekday">Click a date to plan your itinerary</div>
                    <span class="detail-city" id="detailCity" style="display: none;"></span>
                </div>
                <ul class="itinerary-list" id="itineraryList">
                    <!-- Items will be generated by JS -->
                </ul>
                <form class="add-item-form" id="addItemForm" onsubmit="addItem(event)" style="display: none;">
                    <input type="text" class="add-item-input" id="itemInput" placeholder="Add activity..." maxlength="200" autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
                    <button type="submit" class="add-btn">Add</button>
                </form>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Link copied to clipboard</div>

    <script>
        // Trip configuration
        const TRIP_DATES = {
            '2026-05-14': { city: 'travel', cityName: 'Travel' },
            '2026-05-15': { city: 'tokyo', cityName: 'Tokyo' },
            '2026-05-16': { city: 'tokyo', cityName: 'Tokyo' },
            '2026-05-17': { city: 'tokyo', cityName: 'Tokyo' },
            '2026-05-18': { city: 'osaka', cityName: 'Osaka' },
            '2026-05-19': { city: 'osaka', cityName: 'Osaka' },
            '2026-05-20': { city: 'kyoto', cityName: 'Kyoto' },
            '2026-05-21': { city: 'tokyo', cityName: 'Tokyo' },
            '2026-05-22': { city: 'tokyo', cityName: 'Tokyo' },
            '2026-05-23': { city: 'tokyo', cityName: 'Tokyo' },
            '2026-05-24': { city: 'travel', cityName: 'Travel' }
        };

        const WEEKDAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

        // State
        let itineraryData = {};
        let selectedDate = null;
        let saveTimeout = null;

        // Initialize
        function init() {
            loadFromURL();
            renderCalendar();

            // Select first day by default
            const firstDate = Object.keys(TRIP_DATES)[0];
            if (firstDate) {
                selectDate(firstDate);
            }
        }

        // Load data from URL hash
        function loadFromURL() {
            const hash = window.location.hash.slice(1);
            if (hash) {
                try {
                    const decoded = atob(hash);
                    const parsed = JSON.parse(decoded);
                    itineraryData = parsed;
                } catch (e) {
                    console.error('Failed to parse URL data:', e);
                    itineraryData = {};
                }
            }
        }

        // Save data to URL hash (debounced)
        function saveToURL() {
            if (saveTimeout) {
                clearTimeout(saveTimeout);
            }
            saveTimeout = setTimeout(() => {
                const json = JSON.stringify(itineraryData);
                const encoded = btoa(json);
                window.history.replaceState(null, null, '#' + encoded);
            }, 300);
        }

        // Render calendar
        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            // Keep the weekday headers
            const weekdays = grid.querySelectorAll('.weekday-header');
            grid.innerHTML = '';
            weekdays.forEach(wd => grid.appendChild(wd));

            // Calculate starting weekday for May 14, 2026 (Thursday = 4)
            // With Monday-start week: Mon=0, Tue=1, Wed=2, Thu=3, Fri=4, Sat=5, Sun=6
            const firstDate = new Date('2026-05-14');
            const startWeekday = (firstDate.getDay() + 6) % 7;

            // Add empty placeholder days to align with weekday headers
            for (let i = 0; i < startWeekday; i++) {
                const emptyEl = document.createElement('div');
                emptyEl.className = 'day';
                emptyEl.style.visibility = 'hidden';
                grid.appendChild(emptyEl);
            }

            Object.entries(TRIP_DATES).forEach(([date, info]) => {
                const dayEl = document.createElement('div');
                dayEl.className = `day ${info.city}`;
                dayEl.dataset.date = date;
                dayEl.onclick = () => selectDate(date);

                const dateObj = new Date(date);
                const dayNum = dateObj.getDate();
                const weekdayName = WEEKDAYS[(dateObj.getDay() + 6) % 7];
                const items = itineraryData[date] || [];

                let itemsHtml;
                if (items.length === 0) {
                    itemsHtml = '<div class="day-empty">No plans</div>';
                } else {
                    itemsHtml = '<div class="day-items">' +
                        items.slice(0, 3).map(item => `<div class="day-item">${escapeHtml(item)}</div>`).join('') +
                        (items.length > 3 ? `<div class="day-empty">+${items.length - 3} more</div>` : '') +
                        '</div>';
                }

                dayEl.innerHTML = `
                    <div class="day-weekday">${weekdayName}</div>
                    <div class="day-header">
                        <span class="day-number">${dayNum}</span>
                        <span class="day-city">${info.cityName}</span>
                    </div>
                    ${itemsHtml}
                `;

                grid.appendChild(dayEl);
            });
        }

        // Select a date
        function selectDate(date) {
            selectedDate = date;

            // Update calendar selection
            document.querySelectorAll('.day').forEach(day => {
                day.classList.toggle('selected', day.dataset.date === date);
            });

            // Update detail panel
            const info = TRIP_DATES[date];
            const dateObj = new Date(date);

            document.getElementById('detailDate').textContent = String(dateObj.getDate()).padStart(2, '0');
            document.getElementById('detailMonth').textContent = 'May';
            document.getElementById('detailWeekday').textContent = WEEKDAYS[(dateObj.getDay() + 6) % 7];

            const cityEl = document.getElementById('detailCity');
            cityEl.textContent = info.cityName;
            cityEl.className = `detail-city ${info.city}`;
            cityEl.style.display = 'inline-flex';

            // Show form
            document.getElementById('addItemForm').style.display = 'flex';

            // Render items
            renderItems(date);
        }

        // Render items for a date
        function renderItems(date) {
            const list = document.getElementById('itineraryList');
            const items = itineraryData[date] || [];

            if (items.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                        </svg>
                        <p>No activities planned yet</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = items.map((item, index) => `
                <li class="itinerary-item" ${isTouchDevice() ? '' : 'draggable="true"'} data-index="${index}">
                    ${isTouchDevice() ? '' : `<div class="drag-handle">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="9" cy="6" r="1.5"/>
                            <circle cx="9" cy="12" r="1.5"/>
                            <circle cx="9" cy="18" r="1.5"/>
                            <circle cx="15" cy="6" r="1.5"/>
                            <circle cx="15" cy="12" r="1.5"/>
                            <circle cx="15" cy="18" r="1.5"/>
                        </svg>
                    </div>`}
                    <span class="itinerary-item-text">${escapeHtml(item)}</span>
                    <button class="delete-btn" onclick="deleteItem('${date}', ${index})" aria-label="Delete item">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </li>
            `).join('');

            // Setup drag and drop
            setupDragAndDrop(date);
        }

        // Add item
        function addItem(event) {
            event.preventDefault();
            if (!selectedDate) return;

            const input = document.getElementById('itemInput');
            const text = input.value.trim();

            if (!text) return;

            if (!itineraryData[selectedDate]) {
                itineraryData[selectedDate] = [];
            }

            itineraryData[selectedDate].push(text);
            input.value = '';

            renderItems(selectedDate);
            renderCalendar();
            saveToURL();
        }

        // Delete item
        function deleteItem(date, index) {
            if (itineraryData[date]) {
                itineraryData[date].splice(index, 1);
                if (itineraryData[date].length === 0) {
                    delete itineraryData[date];
                }
                renderItems(date);
                renderCalendar();
                saveToURL();
            }
        }

        // Detect touch device
        function isTouchDevice() {
            return window.matchMedia('(pointer: coarse)').matches;
        }

        // Setup drag and drop (disabled on touch devices)
        function setupDragAndDrop(date) {
            if (isTouchDevice()) return; // Skip drag-and-drop on touch devices

            const list = document.getElementById('itineraryList');
            const items = list.querySelectorAll('.itinerary-item');

            items.forEach(item => {
                item.addEventListener('dragstart', (e) => {
                    item.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', item.dataset.index);
                });

                item.addEventListener('dragend', () => {
                    item.classList.remove('dragging');
                });

                item.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                });

                item.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
                    const toIndex = parseInt(item.dataset.index);

                    if (fromIndex === toIndex) return;

                    // Reorder items
                    const dayItems = itineraryData[date];
                    const [movedItem] = dayItems.splice(fromIndex, 1);
                    dayItems.splice(toIndex, 0, movedItem);

                    renderItems(date);
                    renderCalendar();
                    saveToURL();
                });
            });
        }

        // Copy share link
        function copyShareLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const btn = document.querySelector('.btn-primary');
                const text = document.getElementById('shareText');

                btn.classList.add('copied');
                text.textContent = 'Copied!';

                showToast('Link copied to clipboard');

                setTimeout(() => {
                    btn.classList.remove('copied');
                    text.textContent = 'Share';
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
                showToast('Failed to copy link');
            });
        }

        // Show toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Toggle theme (placeholder - dark mode is default)
        function toggleTheme() {
            // Just a visual toggle for now - could expand to light mode
            showToast('Theme toggle');
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
